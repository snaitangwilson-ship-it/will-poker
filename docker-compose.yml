version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: poker_db
    environment:
      POSTGRES_USER: poker_admin
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: poker_ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: poker_cache
    ports:
      - "6379:6379"
volumes:
  pgdata:
